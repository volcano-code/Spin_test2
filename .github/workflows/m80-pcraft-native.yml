name: M80 P-CRAFT Native Operator
on:
  push:
    branches:
      - research/m80-pnmo-large-train-20261112
    paths:
      - "research/NeuralMoments/models/pcraft_ufno/**"
      - ".github/workflows/m80-pcraft-native.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/NeuralMoments/models/pcraft_ufno/**"
      - ".github/workflows/m80-pcraft-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install "numpy<2.3" scipy pytest
      - name: Compile M80 modules
        run: |
          python -m compileall -q research/NeuralMoments/models/pcraft_ufno/spin_pino
      - name: Run M80 and P-CRAFT mathematical contracts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m pytest -q \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_native_pcraft.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_native_train.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_spin_pino.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_dataset.py
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_neural_solver_bridge.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_refined_quadrature.py
      - name: Verify training CLI
        env:
          PYTHONPATH: .
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.native_train --help
