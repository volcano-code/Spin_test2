name: W2 Heart remaining base columns
on:
  push:
    branches: [research/neuralmoments-w2-teacher-20261019]
    paths:
      - 'research/NeuralMoments/teacher/launch/m27-base-columns.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        column: [3, 4, 5, 6, 7, 8, 9]
    uses: ./.github/workflows/w2-heart-linear-stencil.yml
    with:
      protocol: base-c${{ matrix.column }}
