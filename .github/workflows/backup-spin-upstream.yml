name: Back up original Spin branch into Spin_test2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-original:
    if: github.repository == 'volcano-code/Spin_test2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch original branch with its complete reachable Git history
        run: |
          set -euo pipefail
          git clone --single-branch --branch spin-it-strict-computational-v2 https://github.com/volcano-code/Spin.git upstream
          actual="$(git -C upstream rev-parse HEAD)"
          echo "Original HEAD: $actual"
          test "$actual" = "a17ff49cd8a1e6e8b388bc591410bda56d67c28a"
          git -C upstream fsck --no-reflogs
      - name: Publish and verify the pinned branch in this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          ref=refs/heads/upstream-spin-it-strict-computational-v2
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          auth="http.${BACKUP_URL}.extraHeader=AUTHORIZATION: basic $header"
          git -C upstream -c "$auth" push "$BACKUP_URL" "HEAD:$ref"
          actual="$(git -c "$auth" ls-remote --exit-code "$BACKUP_URL" "$ref" | cut -f1)"
          echo "Backup HEAD: $actual"
          test "$actual" = "a17ff49cd8a1e6e8b388bc591410bda56d67c28a"
