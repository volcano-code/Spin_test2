name: W2 Heart original Newton first-step diagnostic
on:
  push:
    branches: [research/neuralmoments-w2-teacher-20261019]
    paths:
      # M30 reuses the frozen M29 driver. Request a new prefix explicitly.
      - 'research/NeuralMoments/teacher/launch/m29-first-step.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  first-step:
    uses: ./.github/workflows/w2-heart-linear-stencil.yml
    with:
      protocol: newton
